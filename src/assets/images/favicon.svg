<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <g transform="translate(18, 18)">
    <!-- Hearts at 0, 90, 180, 270 degrees -->
    <g transform="rotate(0)">
      <path d="M 0,-1 C -2.2,-4.5 -5,-6 -5,-9.5 C -5,-13 -1.8,-14 0,-10.5 C 1.8,-14 5,-13 5,-9.5 C 5,-6 2.2,-4.5 0,-1 Z" fill="#bc4626" />
    </g>
    <g transform="rotate(90)">
      <path d="M 0,-1 C -2.2,-4.5 -5,-6 -5,-9.5 C -5,-13 -1.8,-14 0,-10.5 C 1.8,-14 5,-13 5,-9.5 C 5,-6 2.2,-4.5 0,-1 Z" fill="#bc4626" />
    </g>
    <g transform="rotate(180)">
      <path d="M 0,-1 C -2.2,-4.5 -5,-6 -5,-9.5 C -5,-13 -1.8,-14 0,-10.5 C 1.8,-14 5,-13 5,-9.5 C 5,-6 2.2,-4.5 0,-1 Z" fill="#bc4626" />
    </g>
    <g transform="rotate(270)">
      <path d="M 0,-1 C -2.2,-4.5 -5,-6 -5,-9.5 C -5,-13 -1.8,-14 0,-10.5 C 1.8,-14 5,-13 5,-9.5 C 5,-6 2.2,-4.5 0,-1 Z" fill="#bc4626" />
    </g>

    <!-- Circles at 45, 135, 225, 315 degrees -->
    <g transform="rotate(45)">
      <circle cx="0" cy="-11.5" r="1.8" fill="#2d423b" />
    </g>
    <g transform="rotate(135)">
      <circle cx="0" cy="-11.5" r="1.8" fill="#2d423b" />
    </g>
    <g transform="rotate(225)">
      <circle cx="0" cy="-11.5" r="1.8" fill="#2d423b" />
    </g>
    <g transform="rotate(315)">
      <circle cx="0" cy="-11.5" r="1.8" fill="#2d423b" />
    </g>
    
    <!-- Central circle -->
    <circle cx="0" cy="0" r="3.2" fill="#2d423b" />
  </g>
</svg>
